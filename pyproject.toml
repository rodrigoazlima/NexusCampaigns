[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "Nexus Campaigns vault pipeline: scheduler, static tasks, and shared agent library"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
    "PyYAML>=6",
    "filelock>=3.14,<4",
    "requests>=2.31,<3",
    "Pillow>=10.3,<11",
    "deepface>=0.0.93",
    "tf-keras>=2.16",
    "python-slugify>=8.0,<9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "playwright>=1.40",
]

[project.scripts]
nexus-runner = "nexus.runner:main"

[tool.setuptools]
package-dir = { "" = "system/src" }

[tool.setuptools.packages.find]
where = ["system/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q -m \"not e2e\""
markers = [
    "e2e: end-to-end pipeline tests (require network + Pillow; run with -m e2e)",
]

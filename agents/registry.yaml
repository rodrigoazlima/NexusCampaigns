version: 1
vault_root: "knowledge-base"
agents_dir: "agents"
shared_dir: "system"

# ingestion-agent behavior toggles (agent-ingestion.spec.md)
ingestion_options:
  # When true, top-level vault entries outside the canonical folder structure
  # (00-Inbox, 01-Processing, 02-Library, 03-Campaigns, 04-Relationships,
  # 05-Assets, 99-Archive) are moved into 00-Inbox/ automatically so the
  # pipeline picks them up. When false, they're only logged as warnings.
  auto_absorb_stray: true

llm_endpoints:
  vision_llm:
    url: "http://localhost:1234/v1/chat/completions"
    model: "qwen3-vl-4b-instruct"
    type: vision
    provider: lm-studio
  local_router:
    url: "http://localhost:8080/v1/chat/completions"
    model: "auto"
    type: text
    provider: local-router

# Fallback dispatch used by runner.py when an agent has no agent.json (or no
# entry for the requested task_id). Lets an agent run off its registry.yaml
# `tools:` entry alone. See docs/specs/agents/agent-dispatch-settings.md.
default_dispatch:
  type: lm-studio
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3.5-9b"
  timeout_seconds: 1800
  system_file: "prompts/system.md"

# How runner.py dispatches due/signalled tasks within one scheduling cycle:
#   sync  — one agent at a time, in execution_order (default; safest, matches
#           the pipeline's stage dependencies)
#   async — all due agents for the cycle are dispatched concurrently
#           (threads); queue/state writes are still serialized via
#           agents/shared/file_lock.py so this is safe, just faster wall-clock
pipeline_mode: sync

execution_order:
  - runtime
  - repair
  - ingestion
  - vision
  - lore
  - token
  - wiki
  - classification
  - review
  - wikilink
  - cleanup
  - thumbnails

shared_state_files:
  inbox-queue.json:
    path: system/state/inbox-queue.json
    owner: ingestion
    updaters:
      - vision
      - lore
      - wiki

agents:
  runtime:
    status: active
    description: "Python scheduler and dispatch runtime — the only static code. Not an AI agent."
    interval_seconds: 60
    llm: none
    tools:
      - tools/runner.py

  repair:
    status: active
    task_id: repair-agent
    interval_seconds: 86400
    llm: none
    tools:
      - tools/repair_agent.py

  ingestion:
    status: active
    task_id: ingestion-agent
    interval_seconds: 900
    llm: none
    tools:
      - tools/ingestion_agent.py
    shared_state:
      writes:
        - system/state/inbox-queue.json

  vision:
    status: active
    task_id: vision-agent
    interval_seconds: 900
    llm: vision_llm
    tools:
      - tools/classify_images.py
    prompts:
      - prompts/classify-image.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json
      updates:
        - system/state/inbox-queue.json

  lore:
    status: active
    task_id: lore-agent
    interval_seconds: 900
    llm: vision_llm
    tools:
      - tools/generate_npcs.py
    prompts:
      - prompts/generate-npc.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json
        - agents/vision/state/processed-images.json
      updates:
        - system/state/inbox-queue.json

  token:
    status: active
    task_id: token-agent
    interval_seconds: 900
    llm: none
    tools:
      - tools/generate_tokens.py
    shared_state:
      reads:
        - agents/vision/state/processed-images.json

  classification:
    status: active
    task_id: classification-agent
    interval_seconds: 900
    llm: local_router
    tools:
      - tools/enrich_tags.py
    prompts:
      - prompts/enrich-tags.txt
      - prompts/infer-type.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json

  wiki:
    status: active
    task_id: wiki-agent
    interval_seconds: 900
    llm: local_router
    tools:
      - tools/compile_wiki.py
    prompts:
      - prompts/compile-entity.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json
      updates:
        - system/state/inbox-queue.json

  review:
    status: active
    task_id: review-agent
    interval_seconds: 900
    llm: none
    tools:
      - tools/daily_report.py
      - tools/flag_short_files.py

  wikilink:
    status: active
    task_id: wikilink-agent
    interval_seconds: 3600
    llm: none
    tools:
      - tools/wikilink_library.py
    shared_state:
      reads:
        - agents/wikilink/state/wikilink-state.json

  cleanup:
    status: active
    task_id: cleanup-agent
    interval_seconds: 86400
    llm: none
    tools:
      - tools/cleanup_agent.py

  thumbnails:
    status: active
    task_id: thumbnails-agent
    interval_seconds: 3600
    llm: none
    description: "Pre-generate 320px webp thumbnails for inbox images (dashboard gallery)."
    tools:
      - tools/thumbnails_agent.py
    shared_state:
      reads:
        - system/state/inbox-queue.json

  relationship:
    status: planned
    dependencies:
      - canon
    llm: TBD

  deduplication:
    status: planned
    dependencies:
      - classification
    llm: TBD

  canon:
    status: planned
    dependencies: []
    llm: TBD

  curator:
    status: planned
    dependencies:
      - review
      - classification
    llm: TBD

  search:
    status: planned
    dependencies:
      - canon
    llm: TBD

  adventure-builder:
    status: planned
    dependencies:
      - lore
      - canon
      - relationship
    llm: TBD

  session-builder:
    status: planned
    dependencies:
      - adventure-builder
    llm: TBD

  encounter-builder:
    status: planned
    dependencies:
      - lore
      - vision
      - canon
    llm: TBD

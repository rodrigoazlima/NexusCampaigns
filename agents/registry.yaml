version: 1
vault_root: "knowledge-base"
agents_dir: "agents"
shared_dir: "system"

# ingestion-agent behavior toggles (agent-ingestion.spec.md)
ingestion_options:
  # When true, top-level vault entries outside the canonical folder structure
  # (00-Inbox, 01-Processing, 02-Library, 03-Campaigns, 04-Relationships,
  # 05-Assets, 99-Archive) are moved into 00-Inbox/ automatically so the
  # pipeline picks them up. When false, they're only logged as warnings.
  auto_absorb_stray: true

# timeout_seconds: per-request LLM read timeout (default 120). An agent can
# override it for its own calls via agent.json tasks.<task-id>.llm.timeout_seconds
# (and, since load_llm_endpoint's model_key param, the model itself too -
# e.g. classification's tasks.classification-agent.llm.text_model/vision_model).
llm_endpoints:
  vision_llm:
    url: "http://localhost:1234/v1/chat/completions"
    model: "qwen3-vl-4b-instruct"
    type: vision
    provider: lm-studio
    timeout_seconds: 120
  local_router:
    url: "http://localhost:8080/v1/chat/completions"
    model: "auto"
    type: text
    provider: local-router
    timeout_seconds: 120
  # Classification agent's text-only calls - LM Studio directly rather than
  # LocalRouter's multi-provider catalog: a known-good, already-verified-local
  # model beats router-picked "auto" for assertive/predictable behavior.
  # wiki agent still uses local_router above; this alias is classification-only.
  classification_text_llm:
    url: "http://localhost:1234/v1/chat/completions"
    model: "qwen/qwen3.5-9b"
    type: text
    provider: lm-studio
    timeout_seconds: 120

# Fallback dispatch used by runner.py when an agent has no agent.json (or no
# entry for the requested task_id). Lets an agent run off its registry.yaml
# `tools:` entry alone. See docs/specs/agents/agent-dispatch-settings.md.
default_dispatch:
  type: lm-studio
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3.5-9b"
  timeout_seconds: 1800
  system_file: "prompts/system.md"

# How runner.py dispatches due/signalled tasks within one scheduling cycle:
#   sync  - one agent at a time, in execution_order (default; safest, matches
#           the pipeline's stage dependencies)
#   async - all due agents for the cycle are dispatched concurrently
#           (threads); queue/state writes are still serialized via
#           agents/shared/file_lock.py so this is safe, just faster wall-clock
pipeline_mode: sync

execution_order:
  - runtime
  - vision
  - lore
  - wiki
  - classification

# ---------------------------------------------------------------------------
# Static workers (no LLM) - run in-process inside nexus.runner each cycle.
# See docs/refactor/remove-agentic-useless-static-code/worker-contract.spec.md.
# Declared order = execution order.
#
# kind: queue     - polled every cycle; pending() derives the work items.
#                   Queue workers have NO interval.
# kind: scheduled - cron-like; interval_seconds is the only trigger
#                   (maintenance also fires on a worker-error signal).
#
# Defaults when a key is absent: enabled: true, batch_size: 10,
# interval_seconds: 900 (scheduled only), commit_scope: [] (never commit).
# ---------------------------------------------------------------------------
workers_enabled: true
workers:
  ingestion:
    kind: queue
    batch_size: 25 # files per cycle; inbox dumps can be large
    commit_scope: [".knowledge-base/00-Inbox"] # renames + docx conversions
  thumbnails:
    kind: queue
    batch_size: 10
    commit_scope: [] # everything gitignored
  token:
    kind: queue
    batch_size: 10
    commit_scope: [".knowledge-base/00-Inbox/images"] # tokens written next to sources
    options:
      moldura_by_type: {}
  wikilink:
    kind: queue
    batch_size: 20
    commit_scope: [".knowledge-base/02-Library"]
  shortfiles:
    kind: queue
    batch_size: 50 # cheap per-item work
    commit_scope: [".knowledge-base/01-Processing"]
  report:
    kind: scheduled
    interval_seconds: 150
    commit_scope: [".knowledge-base/01-Processing"] # suggestedQuality writes
  cleanup:
    kind: scheduled
    interval_seconds: 1560
    commit_scope: []
    options:
      retention_days: 90
  maintenance:
    kind: scheduled
    interval_seconds: 86400 # daily; worker-error signals force earlier runs
    commit_scope: []

shared_state_files:
  inbox-queue.json:
    path: system/state/inbox-queue.json
    # Produced by the in-process ingestion worker, which lives inside the
    # runtime - owner must name an entry in agents:.
    owner: runtime
    updaters:
      - vision
      - lore
      - wiki

agents:
  runtime:
    status: active
    description: "Python scheduler, worker loop, and dispatch runtime - the only static code. Not an AI agent."
    interval_seconds: 60
    llm: none
    tools:
      - tools/runner.py

  vision:
    status: active
    task_id: vision-agent
    interval_seconds: 90
    llm: vision_llm
    tools:
      - tools/classify_images.py
    prompts:
      - prompts/classify-step1-type.txt
      - prompts/classify-step2-visual.txt
      - prompts/classify-step3-pf2e-character.txt
      - prompts/classify-step3-pf2e-environment.txt
      - prompts/classify-step4-description.txt
    # Tunables for classify_images.py's classify_image_full multi-step
    # conversation (see docs/agents/vision/image-classification-workflow.md).
    # Shared default - overridable per-machine via agent.json
    # tasks.vision-agent.pipeline.*, same precedence as llm_endpoints
    # (agent.json > registry.yaml > classify_images.py's hardcoded fallback).
    # Free-form, not part of agent-registry.spec.md's RegistryConfig schema -
    # read as a raw dict, same convention as workers' own `options:` blocks.
    options:
      batch_size: 10
      min_tags_target: 6
      max_conversation_messages: 20
      step_max_retries: 2 # + 1 initial attempt = 3 tries per required step
      step_retry_backoff_seconds: 3
      followup_max_tokens: 1024
      face_similarity_threshold: 0.85
      step_max_tokens:
        type: 256
        visual: 4096
        pf2e: 512
        description: 512
    shared_state:
      reads:
        - system/state/inbox-queue.json
      updates:
        - system/state/inbox-queue.json
    # enabled: true - the runtime routes vision-agent dispatch through
    # nexus.tasks.sandbox_run (system/src/nexus/runtime/scheduler.py
    # Runtime.dispatch) instead of running classify_images.py directly.
    # allow_deletes=false means renames (delete old filename + add new one,
    # both inside 00-Inbox/images) apply only the add - the pre-rename
    # original is left in place, logged as dropped. Flip to true to let
    # sandboxed vision runs propagate the delete half too.
    sandbox:
      enabled: true
      allow_deletes: false

  lore:
    status: active
    task_id: lore-agent
    interval_seconds: 150
    llm: vision_llm
    tools:
      - tools/generate_npcs.py
    prompts:
      - prompts/generate-npc.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json
        - agents/vision/state/processed-images.json
      updates:
        - system/state/inbox-queue.json
    sandbox:
      enabled: false
      allow_deletes: false

  classification:
    status: active
    task_id: classification-agent
    interval_seconds: 150
    llm: local_router
    tools:
      - tools/enrich_tags.py
    prompts:
      - prompts/enrich-tags.txt
      - prompts/infer-type.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json
    sandbox:
      enabled: false
      allow_deletes: false

  wiki:
    status: active
    task_id: wiki-agent
    interval_seconds: 150
    llm: local_router
    tools:
      - tools/compile_wiki.py
    prompts:
      - prompts/compile-entity.txt
    shared_state:
      reads:
        - system/state/inbox-queue.json
      updates:
        - system/state/inbox-queue.json
    sandbox:
      enabled: false
      allow_deletes: false

  relationship:
    status: planned
    dependencies:
      - canon
    llm: TBD

  deduplication:
    status: planned
    dependencies:
      - classification
    llm: TBD

  canon:
    status: planned
    dependencies: []
    llm: TBD

  curator:
    status: planned
    dependencies:
      - review
      - classification
    llm: TBD

  search:
    status: planned
    dependencies:
      - canon
    llm: TBD

  adventure-builder:
    status: planned
    dependencies:
      - lore
      - canon
      - relationship
    llm: TBD

  session-builder:
    status: planned
    dependencies:
      - adventure-builder
    llm: TBD

  encounter-builder:
    status: planned
    dependencies:
      - lore
      - vision
      - canon
    llm: TBD

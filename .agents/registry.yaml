version: 1
vault_root: "D:\\Library\\rpg\\dm\\pathway\\knowledge-base"
agents_dir: ".agents"
shared_dir: ".shared"

llm_endpoints:
  vision_llm:
    url: "http://localhost:1234/v1/chat/completions"
    model: "qwen3-vl-4b-instruct"
    type: vision
    provider: lm-studio
  local_router:
    url: "http://localhost:8080/v1/chat/completions"
    model: "auto"
    type: text
    provider: local-router

execution_order:
  - orchestrator
  - ingestion
  - vision
  - lore
  - token
  - wiki
  - classification
  - review

shared_state_files:
  inbox-queue.json:
    path: .shared/state/inbox-queue.json
    owner: ingestion
    updaters:
      - vision
      - lore
      - wiki

agents:
  orchestrator:
    status: active
    interval_seconds: 60
    llm: none
    tools:
      - tools/runner.ps1
      - tools/register-tasks.ps1
      - tools/deregister-tasks.ps1

  ingestion:
    status: active
    task_id: ingestion-agent
    interval_seconds: 3600
    llm: none
    tools:
      - tools/11-ingestion-agent.ps1
    shared_state:
      writes:
        - .shared/state/inbox-queue.json

  vision:
    status: active
    task_id: vision-agent
    interval_seconds: 3600
    llm: vision_llm
    tools:
      - tools/06-classify-images.ps1
      - tools/06-match-token.py
    prompts:
      - prompts/classify-image.txt
    shared_state:
      reads:
        - .shared/state/inbox-queue.json
      updates:
        - .shared/state/inbox-queue.json

  lore:
    status: active
    task_id: lore-agent
    interval_seconds: 3600
    llm: vision_llm
    tools:
      - tools/09-generate-npcs.ps1
      - tools/09-generate-npcs.py
    prompts:
      - prompts/generate-npc.txt
    shared_state:
      reads:
        - .shared/state/inbox-queue.json
        - .agents/vision/state/processed-images.json
      updates:
        - .shared/state/inbox-queue.json

  token:
    status: active
    task_id: token-agent
    interval_seconds: 3600
    llm: none
    tools:
      - tools/10-generate-tokens.ps1
      - tools/10-generate-tokens.py
    shared_state:
      reads:
        - .agents/vision/state/processed-images.json

  classification:
    status: active
    task_id: classification-agent
    interval_seconds: 3600
    llm: local_router
    tools:
      - tools/04-enrich-tags.ps1
    prompts:
      - prompts/enrich-tags.txt
      - prompts/infer-type.txt
    shared_state:
      reads:
        - .shared/state/inbox-queue.json

  wiki:
    status: active
    task_id: wiki-agent
    interval_seconds: 3600
    llm: local_router
    tools:
      - tools/03-compile-wiki.ps1
    prompts:
      - prompts/compile-entity.txt
    shared_state:
      reads:
        - .shared/state/inbox-queue.json
      updates:
        - .shared/state/inbox-queue.json

  review:
    status: active
    task_id: review-agent
    interval_seconds: 900
    llm: none
    tools:
      - tools/08-daily-report.ps1

  relationship:
    status: planned
    dependencies:
      - canon
    llm: TBD

  deduplication:
    status: planned
    dependencies:
      - classification
    llm: TBD

  canon:
    status: planned
    dependencies: []
    llm: TBD

  curator:
    status: planned
    dependencies:
      - review
      - classification
    llm: TBD

  search:
    status: planned
    dependencies:
      - canon
    llm: TBD

  adventure-builder:
    status: planned
    dependencies:
      - lore
      - canon
      - relationship
    llm: TBD

  session-builder:
    status: planned
    dependencies:
      - adventure-builder
    llm: TBD

  encounter-builder:
    status: planned
    dependencies:
      - lore
      - vision
      - canon
    llm: TBD
